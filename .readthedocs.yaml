# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    # Cairo, for the SVG to PDF conversion of the diagrams in the PDF build.
    - libcairo2
    # The Maven wrapper verifies the .zip it downloads; without unzip it fetches a .tar.gz
    # instead, whose checksum does not match.
    - unzip
  jobs:
    # The build image has no Java: install a JDK 25 for the Javadoc. Each job runs in its own
    # shell, so post_build passes JAVA_HOME itself.
    pre_build:
      - bash docs/install-jdk.sh "$HOME/jdk-25"
    # The Javadoc, served under /api/ (linked from the API reference page).
    post_build:
      - JAVA_HOME="$HOME/jdk-25" bash docs/build-javadoc.sh "$READTHEDOCS_OUTPUT/html/api"

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

formats:
  - pdf

python:
  install:
    - requirements: docs/requirements.txt
