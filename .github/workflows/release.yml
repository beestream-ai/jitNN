# Releases jitNN: run it from the Actions tab (Release > Run workflow) with a version such as
# 0.1.0. It sets every module to that version, builds and tests on the reference and CPU
# backends, commits the version change on its own and tags that commit v<version> (main keeps its
# -SNAPSHOT version), publishes the Maven artifacts to GitHub Packages, and creates a GitHub
# Release with the module jars and the Javadoc attached. With "dry run" ticked it stops after
# building, testing and collecting the files.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.1.0 (no leading v)"
        required: true
        type: string
      dry_run:
        description: "Build, test and package only: no tag, packages or release"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check the version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || [[ "$VERSION" == *SNAPSHOT* ]]; then
            echo "::error::'$VERSION' is not a release version such as 0.1.0 or 0.2.0-rc.1"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github

      - name: Set the version
        run: ./mvnw -B -q -Pllm versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false -DprocessAllModules=true

      - name: Build and test
        run: ./mvnw -B verify

      - name: Build the Javadoc
        run: |
          bash docs/build-javadoc.sh "$RUNNER_TEMP/apidocs"
          (cd "$RUNNER_TEMP/apidocs" && zip -qr "$RUNNER_TEMP/jitnn-$VERSION-javadoc.zip" .)

      - name: Publish to GitHub Packages
        if: ${{ !inputs.dry_run }}
        run: ./mvnw -B -DskipTests deploy -DaltDeploymentRepository=github::https://maven.pkg.github.com/${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the release
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Release $VERSION"
          git tag -a "v$VERSION" -m "jitNN $VERSION"
          git push origin "v$VERSION"

      - name: Collect the release files
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          for m in core nn onnx tf gguf djl; do
            cp "jitnn-$m/target/jitnn-$m-$VERSION.jar" "$RUNNER_TEMP/assets/"
          done
          cp "$RUNNER_TEMP/jitnn-$VERSION-javadoc.zip" "$RUNNER_TEMP/assets/"
          ls -l "$RUNNER_TEMP/assets"

      - name: Create the GitHub Release
        if: ${{ !inputs.dry_run }}
        run: |
          gh release create "v$VERSION" "$RUNNER_TEMP"/assets/* --verify-tag --title "jitNN $VERSION" --generate-notes \
            $([[ "$VERSION" == *-* ]] && echo --prerelease)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
