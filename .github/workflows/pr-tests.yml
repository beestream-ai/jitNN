# Builds and tests every pull request on the two self-hosted runners, in parallel: one job per
# runner, which builds once, runs the host tests (reference and CPU backends), then the accelerator
# tests (-Paccel-tests) on each of its TornadoVM backends in turn: CUDA then OpenCL on the Linux
# x86-64 runner, Metal then OpenCL on the Apple silicon runner. The second backend runs even when
# the first fails. scripts/ci/accel-tests.sh runs one backend, with the data gates (MNIST, CIFAR-10,
# transformers, Hugging Face) whose data is staged on the runner (scripts/ci/stage-test-data.sh).
#
# The runners need a JDK 22+ and the TornadoVM 8.1.0 SDKs installed with SDKMAN!. Repository
# variables (Settings > Secrets and variables > Actions > Variables) override the defaults:
#   JITNN_JAVA_HOME                    JDK (default ~/.sdkman/candidates/java/current)
#   TORNADOVM_CUDA_HOME, ..._OPENCL_LINUX_HOME, ..._METAL_HOME, ..._OPENCL_MAC_HOME
#                                      SDK per backend (default ~/.sdkman/candidates/tornadovm/8.1.0-jdk22plus-<backend>)
#   JITNN_DEVICE_CUDA, ..._OPENCL_LINUX, ..._METAL, ..._OPENCL_MAC
#                                      device as <driver>:<device> (default 0:0; `tornado --devices` lists them)
#   JITNN_DATA                         staged test data (default ~/jitnn-data)
#   JITNN_DEVICE_MEMORY                TornadoVM device-memory budget (default 12GB)
#
# Self-hosted runners execute the pull request's code, so jobs run only for branches of this
# repository, never for forks.
name: PR tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64 (CUDA, OpenCL)
            runner: [self-hosted, Linux, X64]
            first: cuda
            first_sdk_var: TORNADOVM_CUDA_HOME
            first_device_var: JITNN_DEVICE_CUDA
            second: opencl
            second_sdk_var: TORNADOVM_OPENCL_LINUX_HOME
            second_device_var: JITNN_DEVICE_OPENCL_LINUX
          - name: macos-arm64 (Metal, OpenCL)
            runner: [self-hosted, macOS, ARM64]
            first: metal
            first_sdk_var: TORNADOVM_METAL_HOME
            first_device_var: JITNN_DEVICE_METAL
            second: opencl
            second_sdk_var: TORNADOVM_OPENCL_MAC_HOME
            second_device_var: JITNN_DEVICE_OPENCL_MAC
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      DATA_OVERRIDE: ${{ vars.JITNN_DATA }}
      MEMORY_OVERRIDE: ${{ vars.JITNN_DEVICE_MEMORY }}
    steps:
      - uses: actions/checkout@v4

      - name: Select the JDK
        shell: bash
        env:
          JAVA_OVERRIDE: ${{ vars.JITNN_JAVA_HOME }}
        run: |
          java_home=${JAVA_OVERRIDE:-${SDKMAN_DIR:-$HOME/.sdkman}/candidates/java/current}
          [ -x "$java_home/bin/java" ] || { echo "::error::no JDK at $java_home (set JITNN_JAVA_HOME)"; exit 1; }
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          echo "$java_home/bin" >> "$GITHUB_PATH"
          "$java_home/bin/java" -version

      - name: Build and run the host tests
        id: build
        shell: bash
        run: ./mvnw -B -ntp install

      - name: Accelerator tests (${{ matrix.first }})
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          SDK_OVERRIDE: ${{ vars[matrix.first_sdk_var] }}
          DEVICE_OVERRIDE: ${{ vars[matrix.first_device_var] }}
          SDK_VAR: ${{ matrix.first_sdk_var }}
        run: bash scripts/ci/accel-tests.sh ${{ matrix.first }}

      - name: Accelerator tests (${{ matrix.second }})
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          SDK_OVERRIDE: ${{ vars[matrix.second_sdk_var] }}
          DEVICE_OVERRIDE: ${{ vars[matrix.second_device_var] }}
          SDK_VAR: ${{ matrix.second_sdk_var }}
        run: bash scripts/ci/accel-tests.sh ${{ matrix.second }}

      - name: Upload the test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.first }}-${{ matrix.second }}-${{ runner.os }}
          path: ci-reports/
          if-no-files-found: ignore
          retention-days: 14
