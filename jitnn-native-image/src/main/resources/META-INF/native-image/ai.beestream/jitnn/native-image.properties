# GraalVM native-image configuration for jitNN, picked up from the jar by any image that has it on
# its class path. TornadoVM's module path and flags depend on the SDK's location, so they stay on
# the native-image command line (see jitnn-native-image/native-image.sh).
#
# - JitnnFeature registers jitNN's kernel classes and task-lambda capturing classes, which
#   TornadoVM resolves by name at run time.
# - TornadoVM drives CUDA through the FFM API.
# - The Vector API (the cpu backend) compiles to SIMD code. This needs a TornadoVM that does not
#   use shared arenas in a native image: the image builder cannot combine -H:+SharedArenaSupport
#   with its Vector API support.
Args = --features=ai.beestream.jitnn.nativeimage.JitnnFeature \
       -H:+UnlockExperimentalVMOptions \
       -H:+ForeignAPISupport \
       -H:+VectorAPISupport \
       -H:-UnlockExperimentalVMOptions
